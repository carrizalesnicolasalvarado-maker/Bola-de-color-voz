const ball = document.getElementById('ball');
const statusEl = document.getElementById('status');
const cerrada = new Image(); cerrada.src = IMG_CERRADA;
const abierta = new Image(); abierta.src = IMG_ABIERTA;
ball.src = IMG_CERRADA;

let ctx, analyser, stream, timer = null;
let speaking = false, lastVoice = 0;
let calibrating = false;
let cfg = load();

function load() {
  try { return JSON.parse(localStorage.getItem('bolavoz') || 'null') || { calibrated: false, thr: 0.02, pmin: 70, pmax: 400 }; }
  catch (e) { return { calibrated: false, thr: 0.02, pmin: 70, pmax: 400 }; }
}
function save() { try { localStorage.setItem('bolavoz', JSON.stringify(cfg)); } catch (e) {} }
function say(t) { statusEl.textContent = t; }
function idleText() {
  return cfg.calibrated ? 'Voz calibrada: solo reacciona a tu voz' : 'Sin calibrar: reacciona a cualquier voz';
}

function setSpeaking(s) {
  speaking = s;
  ball.src = s ? IMG_ABIERTA : IMG_CERRADA;
}

// ---------- análisis de audio ----------
function frame() {
  const buf = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(buf);
  return buf;
}
function rms(b) {
  let s = 0; for (let i = 0; i < b.length; i++) s += b[i] * b[i];
  return Math.sqrt(s / b.length);
}
// Devuelve tono en Hz o -1 si no hay voz con tono claro
function pitch(b) {
  const sr = ctx.sampleRate;
  const lagMin = Math.floor(sr / 400), lagMax = Math.floor(sr / 80);
  let r0 = 0; for (let i = 0; i < b.length; i++) r0 += b[i] * b[i];
  if (r0 <= 0) return -1;
  let best = 0, bestLag = -1;
  for (let lag = lagMin; lag <= lagMax; lag++) {
    let s = 0;
    for (let i = 0; i + lag < b.length; i++) s += b[i] * b[i + lag];
    const r = s / r0;
    if (r > best) { best = r; bestLag = lag; }
  }
  if (best < 0.45 || bestLag < 0) return -1;
  return sr / bestLag;
}

function tick() {
  if (calibrating) return;
  const b = frame();
  const r = rms(b);
  let voice = false;
  if (r > cfg.thr) {
    if (cfg.calibrated) {
      const p = pitch(b);
      voice = p > 0 && p >= cfg.pmin && p <= cfg.pmax;
    } else voice = true;
  }
  const now = Date.now();
  if (voice) lastVoice = now;
  const next = (now - lastVoice) < 350;
  if (next !== speaking) setSpeaking(next);
}

async function startMic() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: false } });
  } catch (e) {
    say('No pude usar el micrófono. Revisa el permiso y que la página sea https.');
    return false;
  }
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  await ctx.resume();
  const src = ctx.createMediaStreamSource(stream);
  analyser = ctx.createAnalyser();
  analyser.fftSize = 2048;
  src.connect(analyser);
  timer = setInterval(tick, 50);
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen'); } catch (e) {}
  say(idleText());
  document.getElementById('bMic').style.display = 'none';
  return true;
}

document.getElementById('bMic').onclick = startMic;

// ---------- calibración ----------
document.getElementById('bCal').onclick = async () => {
  if (!analyser && !(await startMic())) return;
  calibrating = true;
  const wait = ms => new Promise(r => setTimeout(r, ms));

  say('Quédate en silencio 2 segundos...');
  let noise = 0, n = 0;
  let end = Date.now() + 2000;
  while (Date.now() < end) { noise += rms(frame()); n++; await wait(50); }
  noise = n ? noise / n : 0.005;

  say('Ahora HABLA normal durante 6 segundos...');
  const pitches = []; let rsum = 0;
  end = Date.now() + 6000;
  while (Date.now() < end) {
    const b = frame(); const r = rms(b);
    if (r > noise * 2.5) {
      const p = pitch(b);
      if (p > 0) { pitches.push(p); rsum += r; }
    }
    await wait(50);
  }
  calibrating = false;
  if (pitches.length < 20) { say('No te escuché lo suficiente. Habla más cerca/fuerte e intenta otra vez.'); return; }
  pitches.sort((a, b) => a - b);
  const median = pitches[Math.floor(pitches.length / 2)];
  const speechRms = rsum / pitches.length;
  cfg = { calibrated: true, thr: Math.max(noise * 3, speechRms * 0.3), pmin: median * 0.75, pmax: median * 1.3 };
  save();
  say('¡Voz calibrada! ' + idleText());
};

document.getElementById('bReset').onclick = () => {
  cfg = { calibrated: false, thr: 0.02, pmin: 70, pmax: 400 };
  save(); say(idleText());
};

document.getElementById('bClean').onclick = () => {
  document.body.classList.add('clean');
};
document.getElementById('stage').onclick = () => {
  document.body.classList.remove('clean');
};

// ---------- bola flotante (Picture-in-Picture) ----------
const canvas = document.createElement('canvas');
canvas.width = 720; canvas.height = 720;
const cx = canvas.getContext('2d');
function draw() { cx.drawImage(speaking ? abierta : cerrada, 0, 0, 720, 720); }
document.getElementById('bPip').onclick = async () => {
  try {
    if (!document.pictureInPictureEnabled) { say('Tu navegador no permite ventana flotante. Usa Chrome.'); return; }
    draw();
    setInterval(draw, 66);
    const v = document.getElementById('pipvideo');
    v.srcObject = canvas.captureStream(15);
    await v.play();
    await v.requestPictureInPicture();
    say('Bola flotante activa. Sal de esta página y abre WhatsApp.');
  } catch (e) {
    say('No se pudo abrir la ventana flotante: ' + e.message);
  }
};
